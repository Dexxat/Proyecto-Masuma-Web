# Publica el sitio en GitHub Pages en cada push a main (o a mano desde la pestaña Actions).
# Requisito único: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, el que está en curso termina igual.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: |
          npx ng test --watch=false
          npm run test:functions

      # El sitio queda en https://<usuario>.github.io/<repositorio>/ → la ruta base es el nombre del repositorio.
      # Con un dominio propio (ej. masuma.com.ar) cambiar BASE_HREF a "/".
      - name: Compilar (producción)
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
        run: |
          npx ng build --configuration production --base-href "$BASE_HREF"
          # SPA en GitHub Pages: el 404 carga la app y el router muestra la página pedida (/catalogo, /productos/…).
          cp dist/masuma-web/browser/index.html dist/masuma-web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/masuma-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
